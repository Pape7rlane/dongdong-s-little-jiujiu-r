name: Build PearlSR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-linux-musl

          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-linux-musl

          - name: windows-x64
            os: windows-latest
            target: x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Fix Zig filename case
        shell: bash
        run: |
          echo "Checking Session.zig"
          find gameserver/src -iname "*session*" || true

          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows detected: Skip case rename"
          else
            if [ -f gameserver/src/Session.zig ] && [ ! -f gameserver/src/session.zig ]; then
              echo "Creating session.zig"
              cp gameserver/src/Session.zig gameserver/src/session.zig
            fi
          fi

          if [ -f gameserver/src/Session.zig ] || [ -f gameserver/src/session.zig ]; then
            echo "Session file OK"
          else
            echo "Session file missing"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # Linux musl 静态链接
          if [[ "${{ matrix.target }}" == *"-linux-musl" ]]; then
            echo ">>> Linux musl target: patching build.zig in-memory"

            cp build.zig build.zig.orig

            sed -i.bak 's/b\.installArtifact(exe);/exe.linkage = .static;\n    exe.libc_static = true;\n    b.installArtifact(exe);/' build.zig

            echo ">>> Patched build.zig:"
            grep -n -B1 -A4 "installArtifact" build.zig || true
          fi

          echo ">>> Building PearlSR"
          echo "Target: ${{ matrix.target }}"

          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast

          # 恢复 build.zig
          if [ -f build.zig.orig ]; then
            mv build.zig.orig build.zig
            rm -f build.zig.bak
          fi

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd zig-out/bin

          echo "=== PearlSR binaries ==="
          ls -lah

          echo "=== File information ==="
          file *

          echo "=== ldd ==="
          ldd * || true

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== PearlSR binaries ==="
          ls -lah zig-out/bin

      - name: Prepare Release
        shell: bash
        run: |
          mkdir -p release

          # 编译后的程序
          cp -r zig-out/bin/* release/ || true

          # PearlSR 游戏资源
          cp -r resources release/ || true
          cp -r lua release/ || true
          cp -r protocol release/ || true

          # 配置文件
          cp freesr-data.json release/ || true
          cp hotfix.json release/ || true

          # launcher
          cp launcher/launcher.exe release/ || true
          cp launcher/hkrpg.dll release/ || true

          echo "=== Release files ==="
          find release -maxdepth 3 -type f -print

      - name: Package
        shell: bash
        run: |
          cd release

          7z a \
            "../PearlSR-${{ matrix.name }}.zip" \
            *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearlSR-${{ matrix.name }}
          path: PearlSR-${{ matrix.name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PearlSR Build ${{ github.run_number }}
          body: |
            ## PearlSR

            Honkai: Star Rail server emulator 4.6.53 Beta.

            ### Builds

            - Linux x64
            - Linux ARM64
            - Windows x64

            Built with Zig 0.14.1.
          files: |
            **/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
